# Deploy visualization + data/ to GitHub Pages (no Jekyll, no full-repo upload).
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build viz manifest (fast visualization first load)
        run: python3 scripts/build_viz_manifest.py

      - name: Assemble site (HTML + data only)
        run: |
          mkdir -p site
          cp visualization.html site/
          cp visualization.html site/index.html
          cp -r data site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
