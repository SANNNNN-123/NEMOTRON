<!DOCTYPE html>

<head>

    <style>

<body>
    <div class="tooltip" id="tooltip"></div>
    <div class="container">
        <div class="overview-section">
            <div class="prediction-source-wrap">
                <label for="predictionFileSelect">Predictions file</label>
                <select id="predictionFileSelect" aria-label="Select predictions CSV file"></select>
            </div>
            <div class="overview-header">
                <div class="overview-header-table">
                    <table class="breakdown-table" id="breakdownTable"></table>
                </div>
                <div class="overview-header-main">
                    <div class="overview-title">Nemotron Predictions</div>
                    <div class="stats" id="stats"></div>
                    <div class="legend">
                        <div class="legend-item"><div class="legend-box" style="background:#2ecc71; border-color:#27ae60"></div><span>Correct</span></div>
                        <div class="legend-item"><div class="legend-box" style="background:#e74c3c; border-color:#c0392b"></div><span>Wrong</span></div>
                        <div class="legend-item"><div class="legend-box" style="background:#ecf0f1; border-color:#bdc3c7"></div><span>No Prediction</span></div>
                    </div>
                </div>
                <div class="overview-header-spacer" aria-hidden="true"></div>
            </div>
            <div class="view-tabs-wrap" id="viewTabsWrap" hidden>
                <div class="view-tabs" role="tablist" aria-label="Visualization views">
                    <button type="button" class="view-tab active" id="tabOverview" role="tab" aria-selected="true">Overview</button>
                    <button type="button" class="view-tab" id="tabCot" role="tab" aria-selected="false">CoT Traces by Category</button>
                </div>
            </div>
            <div class="dataset-groups" id="datasetGroups"></div>
            <div class="cot-browse" id="cotBrowse" hidden></div>
        </div>
        <div class="detail-overlay" id="detailOverlay"></div>
    </div>

<script>
const PREDICTION_FILES = [
    { path: 'data/predictions_90.7.csv', label: 'predictions_90.7.csv' },
    { path: 'data/predictions.csv', label: 'predictions.csv' },
    { path: 'data/predictions_2.csv', label: 'predictions_2.csv' },
];
const COT_TRACE_FILE = 'data/predictions_90.7.csv';

const CATEGORIES = [
    { key: 'bit_manipulation', label: 'Bit Manipulation', badge: 'badge-bit' },
    { key: 'gravity', label: 'Gravity', badge: 'badge-gravity' },
    { key: 'unit_conversion', label: 'Unit Conversion', badge: 'badge-unit' },
    { key: 'cipher', label: 'Cipher', badge: 'badge-cipher' },
    { key: 'numeral', label: 'Numeral', badge: 'badge-numeral' },
    { key: 'equation_numeric', label: 'Equation (Numeric)', badge: 'badge-equation-numeric' },
    { key: 'equation_symbolic', label: 'Equation (Symbolic)', badge: 'badge-equation-symbolic' },
];

// Same verify logic as adapter-validation-notebook.ipynb (math.isclose rel_tol=1e-2, abs_tol=1e-5)
function verify(storedAnswer, predicted) {
    const s = storedAnswer.trim();
    const p = predicted.trim();
    const sNum = parseFloat(s);
    const pNum = parseFloat(p);
    if (!Number.isNaN(sNum) && !Number.isNaN(pNum)) {
        const diff = Math.abs(sNum - pNum);
        const scale = Math.max(Math.abs(sNum), Math.abs(pNum));
        return diff <= Math.max(1e-2 * scale, 1e-5);
    }
    return p.toLowerCase() === s.toLowerCase();
}

function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const tooltip = document.getElementById('tooltip');
let allProblems = [];
let selectedIdx = null;
let showCotTabs = false;
let currentView = 'overview';
let cotFilter = 'all';
let cotSearch = '';
const cotPageByCategory = {};
const COT_PAGE_SIZE = 40;
/** @type {boolean} */
let dataSourceManifest = false;
/** @type {Array<{id:string,category:string,answer:string}>|null} */
let cachedManifestRows = null;
let cachedTrainText = null;
let cachedCategoryById = null;
/** @type {Map<string,string>|null} */
let promptById = null;
let promptsLoadPromise = null;

async function loadBaseData() {
    if (cachedManifestRows !== null || (cachedTrainText !== null && cachedCategoryById !== null)) return;
    const manifestResp = await fetch('data/viz_manifest.json');
    if (manifestResp.ok) {
        const data = await manifestResp.json();
        cachedManifestRows = data.rows;
        dataSourceManifest = true;
        return;
    }
    dataSourceManifest = false;
    const [trainResp, probResp] = await Promise.all([
        fetch('data/train.csv'),
        fetch('data/problems.jsonl')
    ]);
    if (!trainResp.ok) throw new Error('Failed to load data/train.csv');
    if (!probResp.ok) throw new Error('Failed to load data/problems.jsonl');
    cachedTrainText = await trainResp.text();
    const probText = await probResp.text();
    cachedCategoryById = {};
    for (const line of probText.trim().split('\n')) {
        if (!line) continue;
        const rec = JSON.parse(line);
        cachedCategoryById[rec.id] = rec.category;
    }
}

function forEachTrainRow(trainText, onRow) {
    let inQuote = false;
    let field = '';
    let fields = [];
    let lineNum = 0;
    for (let i = 0; i < trainText.length; i++) {
        const ch = trainText[i];
        if (inQuote) {
            if (ch === '"' && trainText[i + 1] === '"') {
                field += '"';
                i++;
            } else if (ch === '"') {
                inQuote = false;
            } else {
                field += ch;
            }
        } else {
            if (ch === '"') {
                inQuote = true;
            } else if (ch === ',') {
                fields.push(field);
                field = '';
            } else if (ch === '\n' || ch === '\r') {
                if (ch === '\r' && trainText[i + 1] === '\n') i++;
                fields.push(field);
                field = '';
                if (lineNum > 0 && fields.length >= 3) {
                    const [id, prompt, answer] = fields;
                    onRow(id, prompt, answer);
                }
                fields = [];
                lineNum++;
            } else {
                field += ch;
            }
        }
    }
    if (field || fields.length > 0) {
        fields.push(field);
        if (lineNum > 0 && fields.length >= 3) {
            const [id, prompt, answer] = fields;
            onRow(id, prompt, answer);
        }
    }
}

function parseTrainPromptsOnly(trainText) {
    const map = new Map();
    forEachTrainRow(trainText, (id, prompt) => map.set(id, prompt));
    return map;
}

async function ensurePromptsLoaded() {
    if (!dataSourceManifest) return;
    if (promptById !== null) return;
    if (promptsLoadPromise) {
        await promptsLoadPromise;
        return;
    }
    promptsLoadPromise = (async () => {
        const r = await fetch('data/train.csv');
        if (!r.ok) throw new Error('Failed to load data/train.csv for prompts');
        const text = await r.text();
        promptById = parseTrainPromptsOnly(text);
    })();
    try {
        await promptsLoadPromise;
    } catch (e) {
        promptsLoadPromise = null;
        throw e;
    }
}

function parseCsvText(text) {
    const rows = [];
    let inQuote = false;
    let field = '';
    let fields = [];
    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuote) {
            if (ch === '"' && text[i + 1] === '"') {
                field += '"';
                i++;
            } else if (ch === '"') {
                inQuote = false;
            } else {
                field += ch;
            }
        } else if (ch === '"') {
            inQuote = true;
        } else if (ch === ',') {
            fields.push(field);
            field = '';
        } else if (ch === '\n' || ch === '\r') {
            if (ch === '\r' && text[i + 1] === '\n') i++;
            fields.push(field);
            field = '';
            if (fields.length > 1 || fields[0] !== '') rows.push(fields);
            fields = [];
        } else {
            field += ch;
        }
    }
    if (field || fields.length > 0) {
        fields.push(field);
        if (fields.length > 1 || fields[0] !== '') rows.push(fields);
    }
    return rows;
}

function parsePredictionsCsv(predText) {
    const rows = parseCsvText(predText.trim());
    if (rows.length === 0) return { hasTrace: false, byId: {} };
    const header = rows[0];
    const idIdx = header.indexOf('id');
    let predIdx = header.indexOf('predicted');
    if (predIdx === -1) predIdx = header.indexOf('prediction');
    const outputIdx = header.indexOf('output');
    const minlogprobIdx = header.indexOf('minlogprob');
    const hasTrace = outputIdx !== -1;
    const byId = {};
    if (idIdx === -1 || predIdx === -1) {
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (row.length < 2) continue;
            byId[row[0]] = { predicted: row[1], trace: null, minlogprob: null };
        }
        return { hasTrace: false, byId };
    }
    for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.length <= Math.max(idIdx, predIdx)) continue;
        byId[row[idIdx]] = {
            predicted: row[predIdx],
            trace: hasTrace ? (row[outputIdx] || null) : null,
            minlogprob: minlogprobIdx >= 0 ? (row[minlogprobIdx] || null) : null,
        };
    }
    return { hasTrace, byId };
}

function predictionFromRow(row) {
    if (row == null) return null;
    if (typeof row === 'string') return row;
    return row.predicted ?? null;
}

function buildProblemsFromManifest(manifestRows, predData) {
    const byId = predData.byId || predData;
    const problems = [];
    for (const row of manifestRows) {
        const id = row.id;
        const predRow = byId[id];
        const prediction = predictionFromRow(predRow);
        const isCorrect = prediction !== null && verify(row.answer, prediction);
        problems.push({
            id,
            prompt: '',
            answer: row.answer,
            category: row.category,
            prediction,
            isCorrect,
            trace: predRow && predRow.trace ? predRow.trace : null,
            minlogprob: predRow && predRow.minlogprob != null ? predRow.minlogprob : null,
        });
    }
    return problems;
}

function buildProblemsFromTrain(trainText, categoryById, predData) {
    const byId = predData.byId || predData;
    const problems = [];
    forEachTrainRow(trainText, (id, prompt, answer) => {
        const category = categoryById[id] || 'unknown';
        const predRow = byId[id];
        const prediction = predictionFromRow(predRow);
        const isCorrect = prediction !== null && verify(answer, prediction);
        problems.push({
            id,
            prompt,
            answer,
            category,
            prediction,
            isCorrect,
            trace: predRow && predRow.trace ? predRow.trace : null,
            minlogprob: predRow && predRow.minlogprob != null ? predRow.minlogprob : null,
        });
    });
    return problems;
}

async function loadData(predictionPath) {
    await loadBaseData();
    const predResp = await fetch(predictionPath);
    if (!predResp.ok) throw new Error('Failed to load ' + predictionPath);
    const predText = await predResp.text();
    const predData = parsePredictionsCsv(predText);
    const problems = dataSourceManifest
        ? buildProblemsFromManifest(cachedManifestRows, predData)
        : buildProblemsFromTrain(cachedTrainText, cachedCategoryById, predData);
    return { problems, hasTrace: predData.hasTrace };
}

function setupPredictionFileSelect() {
    const select = document.getElementById('predictionFileSelect');
    PREDICTION_FILES.forEach((f) => {
        const opt = document.createElement('option');
        opt.value = f.path;
        opt.textContent = f.label;
        select.appendChild(opt);
    });
    select.addEventListener('change', () => refreshVisualization());
}

function showLoadingState(message) {
    document.querySelector('.overview-section').classList.add('is-loading');
    document.getElementById('predictionFileSelect').disabled = true;
    document.getElementById('stats').textContent = '';
    document.getElementById('breakdownTable').innerHTML = '';
    document.getElementById('viewTabsWrap').hidden = true;
    document.getElementById('cotBrowse').hidden = true;
    document.getElementById('datasetGroups').hidden = false;
    document.getElementById('datasetGroups').innerHTML =
        `<div class="data-loader" role="status" aria-live="polite">
            <div class="data-loader-spinner" aria-hidden="true"></div>
            <span>${esc(message)}</span>
        </div>`;
}

function hideLoadingState() {
    document.querySelector('.overview-section').classList.remove('is-loading');
    document.getElementById('predictionFileSelect').disabled = false;
}

async function refreshVisualization() {
    const select = document.getElementById('predictionFileSelect');
    const path = select.value;
    const label = PREDICTION_FILES.find((f) => f.path === path)?.label || 'predictions';
    clearSelection();
    showLoadingState(`Loading ${label}…`);
    try {
        const loaded = await loadData(path);
        allProblems = loaded.problems;
        showCotTabs = path === COT_TRACE_FILE;
        if (!showCotTabs && currentView === 'cot') currentView = 'overview';
        Object.keys(cotPageByCategory).forEach((k) => delete cotPageByCategory[k]);
        hideLoadingState();
        updateViewTabs();
        buildGrid();
        if (currentView === 'cot') buildCotBrowse();
    } catch (err) {
        console.error(err);
        hideLoadingState();
        showCotTabs = false;
        updateViewTabs();
        document.getElementById('stats').textContent = 'Error loading data';
        document.getElementById('breakdownTable').innerHTML = '';
        document.getElementById('datasetGroups').innerHTML =
            '<div class="data-loader" style="color:#c0392b;">Could not load predictions. Serve this page over HTTP (e.g. a local server) and check the file path.</div>';
    }
}

function updateViewTabs() {
    const wrap = document.getElementById('viewTabsWrap');
    const groups = document.getElementById('datasetGroups');
    const cot = document.getElementById('cotBrowse');
    wrap.hidden = !showCotTabs;
    if (!showCotTabs) {
        groups.hidden = false;
        cot.hidden = true;
    } else {
        groups.hidden = currentView === 'cot';
        cot.hidden = currentView !== 'cot';
    }
    document.getElementById('tabOverview').classList.toggle('active', currentView === 'overview');
    document.getElementById('tabCot').classList.toggle('active', currentView === 'cot');
    document.getElementById('tabOverview').setAttribute('aria-selected', currentView === 'overview' ? 'true' : 'false');
    document.getElementById('tabCot').setAttribute('aria-selected', currentView === 'cot' ? 'true' : 'false');
    const detailEl = document.getElementById('detailOverlay');
    if (currentView === 'cot') detailEl.classList.remove('visible');
}

function switchView(view) {
    if (view === 'cot' && !showCotTabs) return;
    currentView = view;
    updateViewTabs();
    if (view === 'cot') buildCotBrowse();
}

function filterCotProblems(problems) {
    let list = problems.filter((p) => p.trace);
    if (cotFilter === 'correct') list = list.filter((p) => p.isCorrect);
    else if (cotFilter === 'wrong') list = list.filter((p) => p.prediction !== null && !p.isCorrect);
    const q = cotSearch.trim().toLowerCase();
    if (q) list = list.filter((p) => p.id.toLowerCase().includes(q));
    return list;
}

function cotStatusBadge(p) {
    if (p.prediction === null) return '<span class="status-badge" style="background:#ecf0f1;color:#666">No Prediction</span>';
    if (p.isCorrect) return '<span class="status-badge" style="background:#2ecc71;color:#fff">Correct</span>';
    return '<span class="status-badge" style="background:#e74c3c;color:#fff">Wrong</span>';
}

function bindLazyTrace(detailsEl, trace) {
    detailsEl.addEventListener('toggle', () => {
        if (!detailsEl.open) return;
        const box = detailsEl.querySelector('.cot-trace-box');
        if (box && !box.dataset.loaded) {
            box.textContent = trace;
            box.dataset.loaded = '1';
        }
    });
}

function buildCotBrowse() {
    const container = document.getElementById('cotBrowse');
    if (!showCotTabs) {
        container.innerHTML = '';
        return;
    }

    const groups = {};
    CATEGORIES.forEach((c) => { groups[c.key] = []; });
    allProblems.forEach((p) => {
        if (groups[p.category]) groups[p.category].push(p);
    });

    let totalShown = 0;
    CATEGORIES.forEach((cat) => {
        totalShown += filterCotProblems(groups[cat.key]).length;
    });

    let html = `<div class="cot-toolbar">
        <label for="cotFilter">Show</label>
        <select id="cotFilter">
            <option value="all"${cotFilter === 'all' ? ' selected' : ''}>All</option>
            <option value="correct"${cotFilter === 'correct' ? ' selected' : ''}>Correct only</option>
            <option value="wrong"${cotFilter === 'wrong' ? ' selected' : ''}>Wrong only</option>
        </select>
        <label for="cotSearch">Search ID</label>
        <input type="text" id="cotSearch" placeholder="e.g. 00066667" value="${esc(cotSearch)}">
        <span class="cot-count">${totalShown.toLocaleString()} trace${totalShown === 1 ? '' : 's'}</span>
    </div>`;

    if (totalShown === 0) {
        html += '<div class="cot-empty">No traces match the current filter.</div>';
        container.innerHTML = html;
        bindCotToolbar();
        return;
    }

    CATEGORIES.forEach((cat) => {
        const filtered = filterCotProblems(groups[cat.key]);
        if (filtered.length === 0) return;

        const page = cotPageByCategory[cat.key] || 0;
        const totalPages = Math.ceil(filtered.length / COT_PAGE_SIZE);
        const safePage = Math.min(page, Math.max(0, totalPages - 1));
        cotPageByCategory[cat.key] = safePage;
        const start = safePage * COT_PAGE_SIZE;
        const pageItems = filtered.slice(start, start + COT_PAGE_SIZE);

        html += `<details class="cot-category-block" open data-category="${esc(cat.key)}">
            <summary>
                <span class="category-badge ${cat.badge}" style="margin:0">${cat.label}</span>
                <span style="font-weight:400;color:#666">${filtered.length.toLocaleString()} traces</span>
            </summary>
            <div class="cot-category-body">`;

        if (totalPages > 1) {
            html += `<div class="cot-pagination" data-category="${esc(cat.key)}">
                <button type="button" class="cot-page-prev" data-category="${esc(cat.key)}" ${safePage <= 0 ? 'disabled' : ''}>&larr; Prev</button>
                <span>Page ${safePage + 1} of ${totalPages}</span>
                <button type="button" class="cot-page-next" data-category="${esc(cat.key)}" ${safePage >= totalPages - 1 ? 'disabled' : ''}>Next &rarr;</button>
            </div>`;
        }

        pageItems.forEach((p) => {
            const meta = [];
            if (p.prediction !== null) meta.push(`pred: ${p.prediction}`);
            meta.push(`answer: ${p.answer}`);
            if (p.minlogprob != null && p.minlogprob !== '') meta.push(`minlogprob: ${p.minlogprob}`);
            html += `<details class="cot-item" data-idx="${p._globalIdx}">
                <summary>
                    <span class="cot-item-id">${esc(p.id)}</span>
                    ${cotStatusBadge(p)}
                    <span class="cot-item-meta">${esc(meta.join(' · '))}</span>
                </summary>
                <div class="cot-trace-box" data-idx="${p._globalIdx}"></div>
            </details>`;
        });

        html += `</div></details>`;
    });

    container.innerHTML = html;
    bindCotToolbar();

    container.querySelectorAll('.cot-item').forEach((el) => {
        const idx = Number(el.dataset.idx);
        const p = allProblems[idx];
        if (p && p.trace) bindLazyTrace(el, p.trace);
    });

    container.querySelectorAll('.cot-page-prev').forEach((btn) => {
        btn.addEventListener('click', () => {
            const key = btn.dataset.category;
            cotPageByCategory[key] = Math.max(0, (cotPageByCategory[key] || 0) - 1);
            buildCotBrowse();
        });
    });
    container.querySelectorAll('.cot-page-next').forEach((btn) => {
        btn.addEventListener('click', () => {
            const key = btn.dataset.category;
            cotPageByCategory[key] = (cotPageByCategory[key] || 0) + 1;
            buildCotBrowse();
        });
    });
}

function bindCotToolbar() {
    const filterEl = document.getElementById('cotFilter');
    const searchEl = document.getElementById('cotSearch');
    if (filterEl) {
        filterEl.addEventListener('change', () => {
            cotFilter = filterEl.value;
            Object.keys(cotPageByCategory).forEach((k) => delete cotPageByCategory[k]);
            buildCotBrowse();
        });
    }
    if (searchEl) {
        let searchTimer = null;
        searchEl.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                cotSearch = searchEl.value;
                Object.keys(cotPageByCategory).forEach((k) => delete cotPageByCategory[k]);
                buildCotBrowse();
            }, 250);
        });
    }
}

function buildGrid() {
    const groups = {};
    CATEGORIES.forEach(c => { groups[c.key] = []; });
    allProblems.forEach((p, i) => {
        p._globalIdx = i;
        if (groups[p.category]) groups[p.category].push(p);
    });

    const container = document.getElementById('datasetGroups');
    container.innerHTML = '';

    let totalCorrect = 0, totalWrong = 0, totalNoPred = 0;

    CATEGORIES.forEach(cat => {
        const problems = groups[cat.key];
        if (problems.length === 0) return;

        const correct = problems.filter(p => p.isCorrect).length;
        const noPred = problems.filter(p => p.prediction === null).length;
        const wrong = problems.length - correct - noPred;
        totalCorrect += correct;
        totalWrong += wrong;
        totalNoPred += noPred;

        const group = document.createElement('div');
        group.className = 'dataset-group';

        const label = document.createElement('div');
        label.className = 'dataset-label';
        const pct = ((correct / problems.length) * 100).toFixed(1);
        label.textContent = `${cat.label} (${correct} correct / ${wrong} wrong / ${problems.length} total \u2014 ${pct}%)`;
        group.appendChild(label);

        const grid = document.createElement('div');
        grid.className = 'problem-grid';
        const cols = Math.min(150, problems.length);
        grid.style.gridTemplateColumns = `repeat(${cols}, 7px)`;

        problems.forEach((p, i) => {
            const box = document.createElement('div');
            box.className = 'problem-box' + (p._globalIdx === selectedIdx ? ' selected' : '');
            if (p.prediction === null) {
                box.style.backgroundColor = '#ecf0f1';
                box.style.border = '1px solid #bdc3c7';
            } else if (p.isCorrect) {
                box.style.backgroundColor = '#2ecc71';
                box.style.border = '1px solid #27ae60';
            } else {
                box.style.backgroundColor = '#e74c3c';
                box.style.border = '1px solid #c0392b';
            }

            box.addEventListener('mouseenter', (e) => {
                tooltip.style.display = 'block';
                let text = `${p.id} (${i+1}/${problems.length}) \u2014 ${cat.label}`;
                if (p.prediction !== null) {
                    text += ` \u2014 ${p.isCorrect ? 'CORRECT' : 'WRONG'}`;
                    if (!p.isCorrect) text += ` (pred: "${p.prediction}", answer: "${p.answer}")`;
                } else {
                    text += ' \u2014 No prediction';
                }
                tooltip.textContent = text;
                tooltip.style.left = e.clientX + 12 + 'px';
                tooltip.style.top = e.clientY - 28 + 'px';
            });
            box.addEventListener('mousemove', (e) => {
                tooltip.style.left = e.clientX + 12 + 'px';
                tooltip.style.top = e.clientY - 28 + 'px';
            });
            box.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
            box.addEventListener('click', () => selectProblem(p._globalIdx));
            grid.appendChild(box);
        });

        group.appendChild(grid);
        container.appendChild(group);
    });

    const totalPct = ((totalCorrect / allProblems.length) * 100).toFixed(1);
    document.getElementById('stats').textContent =
        `${totalCorrect} correct / ${totalWrong} wrong / ${totalNoPred} no prediction \u2014 ${allProblems.length} total (${totalPct}% accuracy)`;

    // Build breakdown table
    const table = document.getElementById('breakdownTable');
    let tableHtml = `<thead><tr><th>Category</th><th>Correct</th><th>Total</th><th>Accuracy</th><th></th></tr></thead><tbody>`;
    CATEGORIES.forEach(cat => {
        const problems = groups[cat.key];
        if (problems.length === 0) return;
        const correct = problems.filter(p => p.isCorrect).length;
        const pct = ((correct / problems.length) * 100).toFixed(1);
        const barWidth = Math.round((correct / problems.length) * 60);
        tableHtml += `<tr>
            <td><span class="category-badge ${cat.badge}" style="margin:0">${cat.label}</span></td>
            <td style="text-align:right">${correct}</td>
            <td style="text-align:right">${problems.length}</td>
            <td style="text-align:right;font-weight:600">${pct}%</td>
            <td><span class="pct-bar" style="width:${barWidth}px;background:#2ecc71"></span><span class="pct-bar" style="width:${60-barWidth}px;background:#e74c3c"></span></td>
        </tr>`;
    });
    tableHtml += `<tr style="font-weight:700;border-top:2px solid #333">
        <td>Total</td>
        <td style="text-align:right">${totalCorrect}</td>
        <td style="text-align:right">${allProblems.length}</td>
        <td style="text-align:right">${totalPct}%</td>
        <td></td>
    </tr>`;
    tableHtml += `</tbody>`;
    table.innerHTML = tableHtml;
}

function selectProblem(idx) {
    selectedIdx = idx;
    document.querySelectorAll('.problem-box.selected').forEach(b => b.classList.remove('selected'));
    void renderDetail();
}

function clearSelection() {
    selectedIdx = null;
    document.querySelectorAll('.problem-box.selected').forEach(b => b.classList.remove('selected'));
    const detailEl = document.getElementById('detailOverlay');
    detailEl.classList.remove('visible');
    detailEl.innerHTML = '';
}

async function renderDetail() {
    const detailEl = document.getElementById('detailOverlay');
    if (selectedIdx === null) { detailEl.classList.remove('visible'); return; }

    const p = allProblems[selectedIdx];
    let promptText = p.prompt;
    if (dataSourceManifest && promptById === null) {
        detailEl.classList.add('visible');
        detailEl.innerHTML = '<div class="prompt-section" style="color:#666">Loading prompts from train.csv (once per visit)…</div>';
    }
    if (dataSourceManifest) {
        try {
            await ensurePromptsLoaded();
            promptText = promptById.get(p.id) || '';
        } catch (err) {
            console.error(err);
            promptText = '(Could not load prompt — train.csv missing or invalid.)';
        }
    }
    const cat = CATEGORIES.find(c => c.key === p.category) || { label: 'Unknown', badge: '' };

    let statusHtml, statusColor;
    if (p.prediction === null) {
        statusHtml = 'No Prediction';
        statusColor = 'background:#ecf0f1;color:#666';
    } else if (p.isCorrect) {
        statusHtml = 'Correct';
        statusColor = 'background:#2ecc71;color:#fff';
    } else {
        statusHtml = 'Wrong';
        statusColor = 'background:#e74c3c;color:#fff';
    }

    let html = `
        <div class="detail-header">
            <div>
                <span class="problem-info">${esc(p.id)}</span>
                <span class="category-badge ${cat.badge}">${cat.label}</span>
                <span class="status-badge" style="${statusColor}">${statusHtml}</span>
            </div>
            <div class="detail-nav">
                <button id="detailPrev" ${selectedIdx <= 0 ? 'disabled' : ''}>&larr;</button>
                <span class="nav-info">${(selectedIdx + 1).toLocaleString()} of ${allProblems.length.toLocaleString()}</span>
                <button id="detailNext" ${selectedIdx >= allProblems.length - 1 ? 'disabled' : ''}>&rarr;</button>
                <button class="detail-close" id="detailClose">Close</button>
            </div>
        </div>
    `;

    // Prompt
    html += `<div class="prompt-section"><div class="prompt-full">${esc(promptText)}</div></div>`;

    // Ground truth answer
    html += `<div class="answer-row">
        <span class="answer-label">Ground Truth:</span>
        <span class="answer-display" style="background:#2ECC40;color:#000">${esc(p.answer)}</span>
    </div>`;

    // Prediction
    if (p.prediction !== null) {
        const predBg = p.isCorrect ? '#2ECC40' : '#FF4136';
        const predColor = p.isCorrect ? '#000' : '#fff';
        html += `<div class="answer-row">
            <span class="answer-label">Prediction:</span>
            <span class="answer-display" style="background:${predBg};color:${predColor}">${esc(p.prediction)}</span>
            <span style="font-weight:bold;color:${p.isCorrect ? '#2ECC40' : '#FF4136'}">${p.isCorrect ? 'CORRECT' : 'WRONG'}</span>
        </div>`;
    }

    detailEl.classList.add('visible');
    detailEl.innerHTML = html;

    // Bind navigation
    document.getElementById('detailPrev').addEventListener('click', () => { selectProblem(selectedIdx - 1); });
    document.getElementById('detailNext').addEventListener('click', () => { selectProblem(selectedIdx + 1); });
    document.getElementById('detailClose').addEventListener('click', clearSelection);

    detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
    if (selectedIdx === null) return;
    if (e.key === 'Escape') clearSelection();
    if (e.key === 'ArrowLeft' && selectedIdx > 0) selectProblem(selectedIdx - 1);
    if (e.key === 'ArrowRight' && selectedIdx < allProblems.length - 1) selectProblem(selectedIdx + 1);
});

// Init
setupPredictionFileSelect();
document.getElementById('tabOverview').addEventListener('click', () => switchView('overview'));
document.getElementById('tabCot').addEventListener('click', () => switchView('cot'));
refreshVisualization();
</script>
</body>
</html>
